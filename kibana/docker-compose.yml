services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=Elastic12345
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:Elastic12345 http://localhost:9200/_cluster/health | grep -q status"]
      interval: 10s
      timeout: 10s
      retries: 30

  setup:
    image: curlimages/curl:latest
    container_name: elasticsearch-setup
    depends_on:
      elasticsearch:
        condition: service_healthy
    command:
      - -s
      - -X
      - POST
      - -u
      - elastic:Elastic12345
      - -H
      - "Content-Type: application/json"
      - http://elasticsearch:9200/_security/user/kibana_system/_password
      - -d
      - '{"password":"KibanaSys12345"}'
    restart: "no"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.0
    container_name: kibana
    depends_on:
      setup:
        condition: service_completed_successfully
    volumes:
       - ./kibana.yml:/usr/share/kibana/config/kibana.yml
    ports:
      - "5601:5601"

volumes:
  esdata:


