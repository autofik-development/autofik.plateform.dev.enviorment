services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: postgres1
      POSTGRES_USER: postgres1
      POSTGRES_PASSWORD: root123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - postgres-network

volumes:
  pgdata:

networks:
  postgres-network:
    external: true