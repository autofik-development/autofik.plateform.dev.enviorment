services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: postgres
    restart: always
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - postgres-network

volumes:
  pgdata: